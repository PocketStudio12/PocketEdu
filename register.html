<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pocket Edu - Register</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo">
            📚
        </div>

        <h1>Pocket Edu</h1>

        <p
            class="description"
            data-lang="createAccount">
            অ্যাকাউন্ট তৈরি করুন
        </p>
<div class="language-switch">
    <button id="bnButton" type="button">
        বাংলা
    </button>

    <button id="enButton" type="button">
        English
    </button>
</div>
        <p data-lang="selectEmoji">
            প্রোফাইল ইমোজি নির্বাচন করুন
        </p>

        <div class="emoji-container">

            <button type="button">😀</button>
            <button type="button">😎</button>
            <button type="button">🐼</button>
            <button type="button">🦊</button>
            <button type="button">🐱</button>
            <button type="button">🚀</button>

        </div>

        <form id="registerForm">

            <label data-lang="fullName">
                পূর্ণ নাম
            </label>

            <div class="input-box">
                <span>👤</span>

                <input
                    id="fullName"
                    type="text"
                    required>
            </div>

            <label data-lang="username">
                ইউজারনেম
            </label>

            <div class="input-box">
                <span>🏷️</span>

                <input
                    id="username"
                    type="text"
                    required>
            </div>

            <label data-lang="phone">
                ফোন নম্বর
            </label>

            <div class="input-box">
                <span>📱</span>

                <input
                    id="phone"
                    type="tel"
                    required>
            </div>

            <label data-lang="password">
                পাসওয়ার্ড
            </label>

            <div class="input-box">
                <span>🔑</span>

                <input
                    id="password"
                    type="password"
                    required>
            </div>

            <label data-lang="confirmPassword">
                পাসওয়ার্ড নিশ্চিত করুন
            </label>

            <div class="input-box">
                <span>🔐</span>

                <input
                    id="confirmPassword"
                    type="password"
                    required>
            </div>

            <button
                class="main-button"
                type="submit"
                data-lang="create">
                অ্যাকাউন্ট তৈরি করুন
            </button>

        </form>

        <div
            id="message"
            class="message">
        </div>

        <p class="bottom-text">

            <span data-lang="haveAccount">
                আগেই অ্যাকাউন্ট আছে?
            </span>

            <a
                href="login.html"
                data-lang="loginNow">
                লগইন করুন
            </a>

        </p>

    </div>

</div>

<script type="module">
    import { setLanguage } from "./js/language.js";

    const savedLanguage =
        localStorage.getItem("language") || "bn";

    setLanguage(savedLanguage);

    document
        .getElementById("bnButton")
        .addEventListener("click", () => {
            setLanguage("bn");
        });

    document
        .getElementById("enButton")
        .addEventListener("click", () => {
            setLanguage("en");
        });
</script>

<script
    type="module"
    src="js/register.js">
</script>

</body>

</html>
